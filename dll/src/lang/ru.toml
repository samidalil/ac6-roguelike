buy = "В меню «{menu.buy}» продаются случайные детали для AC,\nобновляемые {renewal}.\n\n• Проданные вами детали снова продаются там\nдо следующего обновления.\n• Предел деталей: {max_parts}, включая установленные:\nсверх него покупка невозможна."
sell_value = "{pct}% её стоимости"
sell_value_weapons = "{pct}% её стоимости\n(оружие: {weapon_pct}%)"
sell = "Продавайте детали для AC с помощью меню\n«{menu.sell}».\n\n• Проданная деталь приносит {value}.\n• Её можно выкупить по той же цене в меню «{menu.buy}»\nдо следующего обновления магазина.\n• Предел деталей для выкупа: {copies}; сверх него\nсамая старая идёт в утиль.\n• Если деталей в гараже больше предела ({max_parts}),\nпродавайте их, пока не вернётесь к пределу."

[inventory]
