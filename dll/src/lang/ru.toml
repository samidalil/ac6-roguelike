stuck = "ИНВЕНТАРЬ ЗАПОЛНЕН\n\nДеталей: {n}, мест: {max}, продать нечего. Снимите лишние ({over}) с AC в меню «{menu.assembly}», затем продайте их в меню «{menu.sell}»."

