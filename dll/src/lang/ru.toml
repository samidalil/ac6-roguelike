# The mod's texts in Russian. DRAFT: machine-written from the game's own terms, to review. Same keys and format as
# en.toml; a missing key uses en.toml's. Counts are written "Деталей: 22" to keep the plural forms out; menu names in
# «» like the game's own tutorials.

list_separator = ", "
game_over = "GAME OVER"

[number]
