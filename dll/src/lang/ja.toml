stuck = "所持パーツ上限超過\n\n上限{max}個に対して{n}個所持しており、売却できるパーツがありません\n{menu.assembly}でACから{over}個外してから{menu.sell}で売却してください"

[buyback]
full_confirm = "買い戻しリストが満杯です：{part}は買い戻せなくなります\n{game_text}"

