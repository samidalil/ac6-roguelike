# One OS chip per file (chips/ next to the DLL; restart the game after a change). A chip is a mission reward like the
# OS Tunings: each pick adds a level. In the settings file it is known by its row (9000 + id) or its name, in
# [part_rarity], [lost_on_failure] and [max_occurrences].
id = 1                         # 1 to 32, unique: the chip's save slot (row 9001); changing it mid-run loses its level
name = "Reinforced Plating"    # shown on the reward tile (English, and any game language without its own name)
stat = "AP"                    # stat shown on the tile with the level's value: "AP +5%"
# name / stat / unit in another game language: name.<code> = "..." (codes: fr, ja, de, it, es, es-419, pt, pl, ru, ko,
# zh-tw, zh-cn; es-419 falls back to es). The settings may use any of the names.
name.fr = "Blindage renforcé"
stat.fr = "PB"
# AI-translated (ja, de, it, es, es-419, pt, pl, ru, ko, zh-tw, zh-cn)
name.ja = "装甲強化"
stat.ja = "AP"
name.de = "Verstärkte Panzerung"
stat.de = "AP"
name.it = "Corazza rinforzata"
stat.it = "PA"
name.es = "Blindaje reforzado"
stat.es = "AP"
name.es-419 = "Blindaje reforzado"
stat.es-419 = "PA"
name.pt = "Blindagem Reforçada"
stat.pt = "PA"
name.pl = "Wzmocniony pancerz"
stat.pl = "PP"
name.ru = "Усиленная броня"
stat.ru = "ПБ"
name.ko = "장갑 강화"
stat.ko = "AP"
name.zh-tw = "強化裝甲"
stat.zh-tw = "AP"
name.zh-cn = "强化装甲"
stat.zh-cn = "AP"
levels = "5/10/15"             # effect value per level, in % (1 to 15 levels)

[effect]
# target = "+" (raised by the level's value in %), "-" (lowered by it), "add" (the value itself added) or "sub".
# Targets on YOUR AC only (enemies are not affected; Assemblage still shows the parts' own stats): ap (max AP),
# en_capacity (EN capacity), weight (total weight), ammo (every weapon's total ammunition, filled at mission start).
# Targets of the run: pool.<NAME>.weight (odds of a [pool.NAME] in the shop and the rewards), reward.count (rewards
# per mission, 0 to 3), reward.choices (parts offered per reward, 1 to 12), shop.weapons / shop.parts (shop size,
# 16 slots at most). Several chips on one target add up.
ap = "+"
