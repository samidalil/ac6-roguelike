# Amplified impact: the stagger (ACS impact) your weapons deal is raised for the whole mission. A SpEffect row per
# level (atkEnemyImpactCorrectRate), applied at each mission start (see nanorepair.toml for the format).
# atkEnemyImpactCorrectRate counts on hits on characters that are not the player; atkImpactCorrectRate only on assault
# boost attacks (wepParamChange 5), see RE_NOTES.
id = 11
name = "Amplified Impact"
stat = "Impact"
name.fr = "Impact amplifié"
stat.fr = "Impact"
name.ja = "衝撃増幅"
stat.ja = "衝撃力"
name.de = "Verstärkter Aufschlag"
stat.de = "Aufschlag"
name.it = "Impatto amplificato"
stat.it = "Impatto"
name.es = "Impacto amplificado"
stat.es = "Impacto"
name.pt = "Impacto Amplificado"
stat.pt = "Impacto"
name.pl = "Wzmocnione uderzenie"
stat.pl = "Siła uderzenia"
name.ru = "Усиленная нагрузка"
stat.ru = "Нагрузка"
name.ko = "충격 증폭"
stat.ko = "충격력"
name.zh-tw = "衝擊增幅"
stat.zh-tw = "衝擊力"
name.zh-cn = "冲击增幅"
stat.zh-cn = "冲击力"
levels = "8/15/20"

[on.mission_start]
speffect = "900000111/900000112/900000113"

[speffect.900000111]
copy = 9405                # every rate at 1.0
changeHpPoint = 0
effectEndurance = -1       # the whole mission
atkEnemyImpactCorrectRate = 1.08

[speffect.900000112]
copy = 9405
changeHpPoint = 0
effectEndurance = -1
atkEnemyImpactCorrectRate = 1.15

[speffect.900000113]
copy = 9405
changeHpPoint = 0
effectEndurance = -1
atkEnemyImpactCorrectRate = 1.2
