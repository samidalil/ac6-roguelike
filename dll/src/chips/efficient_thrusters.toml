# Efficient thrusters: rising and quick boosts draw less EN for the whole mission. Rising: a SpEffect row per level
# (energyDrawRate_UpBoost, applied at each mission start; the ground and air boost fields do nothing, every booster
# draws 0 EN there). Quick boosts: the quick_boost_en target (the cost the game charges, player only). See
# nanorepair.toml and reinforced_plating.toml for the format.
id = 12
name = "Efficient Thrusters"
stat = "EN Saving (Upward, Quick Boost)"
name.fr = "Propulseurs économes"
stat.fr = "Économie EN (ascension, boost rapide)"
# AI-translated (ja, de, it, es, es-419, pt, pl, ru, ko, zh-tw, zh-cn)
name.ja = "省エネスラスター"
stat.ja = "EN消費軽減（上昇、クイックブースト）"
name.de = "Sparsame Triebwerke"
stat.de = "EN-Ersparnis (Steigen, Turboboost)"
name.it = "Propulsori efficienti"
stat.it = "Risparmio EN (ascesa, spinta rapida)"
name.es = "Propulsores eficientes"
stat.es = "Ahorro de EN (ascenso, impulso rápido)"
name.pt = "Propulsores Eficientes"
stat.pt = "Economia de EN (subida, Impulso Rápido)"
name.pl = "Oszczędne silniki"
stat.pl = "Oszczędność EN (wznoszenie, szybki dopalacz)"
name.ru = "Экономичные двигатели"
stat.ru = "Экономия энергии (подъём, моментальное ускорение)"
name.ko = "절약형 스러스터"
stat.ko = "EN 소비 감소(상승, 퀵 부스트)"
name.zh-tw = "節能推進器"
stat.zh-tw = "EN消耗減少（上升、迅捷推進）"
name.zh-cn = "节能推进器"
stat.zh-cn = "EN消耗减少（上升、迅捷推进）"
levels = "8/15/20"

[effect]
quick_boost_en = "-"

[on.mission_start]
speffect = "900000121/900000122/900000123"

[speffect.900000121]
copy = 9405
changeHpPoint = 0
effectEndurance = -1
energyDrawRate_UpBoost = 0.92

[speffect.900000122]
copy = 9405
changeHpPoint = 0
effectEndurance = -1
energyDrawRate_UpBoost = 0.85

[speffect.900000123]
copy = 9405
