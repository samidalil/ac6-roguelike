# Nanorepair: the AC repairs itself during missions. An advanced chip: its effect is a SpEffect of its own, one
# [speffect.<row id>] per level compiled into mod/regulation.bin by tools/build_regulation.ps1 (SpEffectParam fields
# by Smithbox name), applied to your AC by the speffect action (see reinforced_plating.toml and
# performance_bonus.toml for the rest of the format).
id = 7
name = "Nanorepair"
stat = "Repair"
unit = " AP/s"
name.fr = "Nanoréparation"
stat.fr = "Réparation"
unit.fr = " PB/s"
name.ja = "ナノリペア"
stat.ja = "修復"
unit.ja = " AP/秒"
name.de = "Nanoreparatur"
stat.de = "Reparatur"
unit.de = " AP/s"
name.it = "Nanoriparazione"
stat.it = "Riparazione"
unit.it = " PA/s"
name.es = "Nanorreparación"
stat.es = "Reparación"
unit.es = " AP/s"
name.es-419 = "Nanorreparación"
stat.es-419 = "Reparación"
unit.es-419 = " PA/s"
name.pt = "Nanorreparo"
stat.pt = "Reparo"
unit.pt = " PA/s"
name.pl = "Nanonaprawa"
stat.pl = "Naprawa"
unit.pl = " PP/s"
name.ru = "Наноремонт"
stat.ru = "Ремонт"
unit.ru = " ПБ/с"
name.ko = "나노 리페어"
stat.ko = "수리"
unit.ko = " AP/초"
name.zh-tw = "奈米修復"
stat.zh-tw = "修復"
unit.zh-tw = " AP/秒"
name.zh-cn = "纳米修复"
stat.zh-cn = "修复"
unit.zh-cn = " AP/秒"
levels = "20/40/60"

[on.mission_start]
speffect = "900000071/900000072/900000073"   # the row of the chip's level

[speffect.900000071]
copy = 9405                # a repair kit row (every rate at 1.0)
changeHpPoint = -20        # AP restored per tick (negative = repair)
motionInterval = 1.0       # a tick every second
effectEndurance = -1       # until the end of the mission

[speffect.900000072]
copy = 9405
changeHpPoint = -40
motionInterval = 1.0
effectEndurance = -1

[speffect.900000073]
copy = 9405
changeHpPoint = -60
motionInterval = 1.0
effectEndurance = -1
