# Adrenaline: each enemy destroyed speeds up your EN recovery for 10 s (a timed SpEffect row per level; the next kill
# starts the 10 s again, it does not stack). The DLL applies a mod row's energyRecoverSpeedRate to the net recovery, so
# 1.2 is +20 % (the game alone applies it before the generator load: about +80 % on a starter AC). See nanorepair.toml
# for the format.
id = 13
name = "Adrenaline"
stat = "EN Recovery per Kill"
name.fr = "Adrénaline"
stat.fr = "Récupération EN par élimination"
name.ja = "アドレナリン"
stat.ja = "撃破時のEN回復"
name.de = "Adrenalin"
stat.de = "EN-Erholung pro Abschuss"
name.it = "Adrenalina"
stat.it = "Recupero EN per abbattimento"
name.es = "Adrenalina"
stat.es = "Recuperación de EN por derribo"
name.pt = "Adrenalina"
stat.pt = "Recuperação de EN por abate"
name.pl = "Adrenalina"
stat.pl = "Odnowa EN za zniszczenie"
name.ru = "Адреналин"
stat.ru = "Восполнение энергии за уничтожение"
name.ko = "아드레날린"
stat.ko = "격파 시 EN 회복"
name.zh-tw = "腎上腺素"
stat.zh-tw = "擊破時EN恢復"
name.zh-cn = "肾上腺素"
stat.zh-cn = "击破时EN恢复"
levels = "20/35/50"

[on.enemy_destroyed]
speffect = "900000131/900000132/900000133"

[speffect.900000131]
copy = 9405
changeHpPoint = 0
effectEndurance = 10       # seconds
energyRecoverSpeedRate = 1.2

[speffect.900000132]
copy = 9405
changeHpPoint = 0
effectEndurance = 10
energyRecoverSpeedRate = 1.35

[speffect.900000133]
copy = 9405
changeHpPoint = 0
effectEndurance = 10
energyRecoverSpeedRate = 1.5
