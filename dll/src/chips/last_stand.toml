# Last stand: while your AP is below 30 %, your weapons deal more damage. The SpEffect rows carry the condition
# (conditionHp: the game turns the effect on and off itself); last_stand.lua applies the level's row in each mission.
# The rates are the *AttackRate fields: the *AttackPowerRate ones did not change the damage (RE_NOTES).
id = 10
name = "Dernier recours"
stat = "Dégâts sous 30 % PA"
levels = "10/20/30"

[speffect.900000101]
copy = 9405                # every rate at 1.0
changeHpPoint = 0
effectEndurance = -1       # the whole mission
conditionHp = 30           # active only while AP <= 30 %
physicsAttackRate = 1.1
magicAttackRate = 1.1
fireAttackRate = 1.1
thunderAttackRate = 1.1

[speffect.900000102]
copy = 9405
changeHpPoint = 0
