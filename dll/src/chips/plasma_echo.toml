# Plasma echo: each enemy destroyed fires plasma cannon shots (the FASAN/60E's) from where it fell at your next lock
# target, once your lock has left the destroyed enemy (no target: no shot). The shots come from your AC, no plasma
# cannon needed. plasma_echo.lua fires the level's value of shots, `interval` s apart; `weapon` / `behavior` are the
# weapon (EquipParamWeapon) and the BehaviorParam_PC row it fires, `height` the m above the enemies' feet the shots go
# from / to, the lock checked every `step` s, `wait` s at most. The rows below are the cannon's own (behavior 132300000
# -> bullet 32300000 -> attack 32300000) without the shooter knockback: fired from your AC, each shot pushed it ~10 m
# away from the shot ([behavior / bullet / atk.<row>] sections: rows of mod/regulation.bin).
id = 20
name = "Écho plasma"
stat = "Tirs plasma par élimination"
unit = ""
levels = "1/2/3"

[params]
weapon = "30230000"     # PLASMA CANNON - FASAN/60E
behavior = "900000201"  # the cannon's, without its shooter knockback (rows below)
interval = "0.4"
height = "3"
step = "0.1"
wait = "2"

[behavior.900000201]
copy = 132300000
refId = 32300900

[bullet.32300900]
copy = 32300000
atkId_Bullet = 32300900

[atk.32300900]
copy = 32300000
shooterKnockbackMPS = 0
shooterFlyKnockbackMPS = 0
