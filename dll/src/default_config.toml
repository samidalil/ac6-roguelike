# Armored Core VI roguelike settings. Edit and restart the game.

[economy]
mission_pay_percent = 0          # % of the game's mission pay you receive (0 = selling parts is the only income)
arena_repeat_pay_percent = 0     # % of the arena's pay for repeat fights
ammo_cost_percent = 100          # % of the game's ammunition costs charged after a mission
repair_cost_percent = 100        # % of the game's repair costs charged after a mission
starting_credits = 100000        # pay of the first mission of a run (Illegal Entry), the run's starting money

[rewards]
parts_per_mission = 1            # rewards at the end of each cleared mission (0 to 3)
reward_choices = 3               # parts offered for each reward, you pick one (1 to 12; 1 = given directly)

[shop]
# A part's value is the game's shop price; [prices] gives values to the parts the game prices at 0 (starter
# parts...) and can change any other. Without an entry, a 0-priced part is worth the cheapest shop part of its type.
# Core expansions cannot be sold.
# charge = what buying costs: the shop price, and on a failed sortie each starter part bought to fill an emptied
# slot (no spare part for it).
part_sell_percent = 25           # frame parts and internals sell for this % of their value
weapon_sell_percent = 25         # weapons sell for this % of their value
item_charge_percent = 100        # every part (weapons included) costs this % of its value
shop_weapons = 1                 # weapons offered after each cleared mission
shop_parts = 2                   # other parts offered after each cleared mission (weapons + parts: 8 at most)
reroll_interval = 1              # cleared missions between shop rerolls (1 = every mission; rewards still come every mission)
# Every part offered or given leaves its pool (weapons, other parts) until that pool runs dry; then the pool refills
# with every part you do not own and have not lost for good. A part you own is never offered or given.
pool_limit = 0                   # testing: each pool keeps only its first N parts (0 = every part)

[rarity]
# Shop offers and mission rewards are drawn by rarity tier, then uniformly within the tier. Tiers come from
# [part_rarity] (1 common, 2 rare, 3 epic); every part it does not list is in the unlisted_tier pool.
unlisted_tier = 1
common_weight = 60               # odds of each tier (any scale; a tier with no part left is skipped)
rare_weight = 30
epic_weight = 10

