# Armored Core VI roguelike settings. Edit and restart the game.

[economy]
mission_pay_percent = 0          # % of the game's mission pay you receive, 0 or more (0 = selling parts is the only income)
arena_repeat_pay_percent = 0     # % of the arena's pay for repeat fights, 0 or more
ammo_cost_percent = 100          # % of the game's ammunition costs charged after a mission, 0 or more
repair_cost_percent = 100        # % of the game's repair costs charged after a mission, 0 or more
starting_credits = 100000        # pay of the first mission of a run (Illegal Entry), the run's starting money (0 to 999999999)

[rewards]
parts_per_mission = 1            # rewards at the end of each cleared mission (0 to 3)
reward_choices = 3               # parts offered for each reward, you pick one (1 to 12; 1 = given directly)
os_rewards = 1                   # 0 or 1. 1 = OS Tunings are rewards: each pick adds one level (up to the tuning's max;
                                 # a core expansion also gives its part), and the OS Tuning menu stays locked

[shop]
# A part's value is the game's shop price; [prices] gives values to the parts the game prices at 0 (starter
# parts...) and can change any other. Without an entry, a 0-priced part is worth the cheapest shop part of its type.
# Core expansions cannot be sold.
# charge = what buying costs: the shop price, and on a failed sortie each starter part bought to fill an emptied
# slot (no spare part for it).
part_sell_percent = 25           # frame parts and internals sell for this % of their value, 0 or more
weapon_sell_percent = 25         # weapons sell for this % of their value, 0 or more
item_charge_percent = 100        # every part (weapons included) costs this % of its value, 0 or more
shop_weapons = 1                 # weapons offered after each cleared mission (0 to 16)
shop_parts = 2                   # other parts offered after each cleared mission (0 to 16; weapons + parts: 16 at most)
reroll_interval = 1              # cleared missions between shop rerolls, 1 to 255 (1 = every mission; rewards still
                                 # come every mission)
# Shop offers and rewards can repeat. Weapons and frame parts (head, core, arms, legs) are offered even when you own
# them (each copy is its own part); boosters, generators and FCS are not offered while owned or once lost for good.

[inventory]
max_parts = 20                   # parts you can own: weapons, frame parts and internals, equipped ones included (each
                                 # copy counts; core expansions don't). Full: the shop refuses purchases; a reward that
                                 # goes over asks you to sell parts until you are back at the limit (7 or more)

[rarity]
# Shop offers and mission rewards are drawn from pools: a pool by its weight, then a part uniformly within it. Each
# [pool.NAME] section is a pool; [part_rarity] puts parts in them, and every part it does not list goes to the
# unlisted_pool. A pool whose weight is 0 is out: its parts are never offered in the shop nor as a reward (selling,
# buy-back and starters unchanged). With few parts left a roll offers fewer: empty shop slots, offers with fewer parts
# to pick from, or no reward at all.
unlisted_pool = unlisted         # pool of the parts [part_rarity] does not list (a name with no [pool.NAME] section
                                 # gets a pool like [pool.unlisted]: weight 0, no label)

# [pool.NAME]: weight = odds of the pool, 0 or more (any scale; a pool with no part left is skipped, 0 = out), color =
# its label colour on the reward tiles ("#RRGGBB" or 0xRRGGBB), show_name = 0 or 1 (1 shows the label on the tiles),
# label = the text shown (default: the pool's name; always shown in upper case). 200 pools at most.
[pool.unlisted]                  # always there, even without this section
weight = 0
color = "#6E7378"
show_name = 0

[pool.common]
weight = 50
color = "#C8CDD2"

[pool.uncommon]
weight = 25
color = "#4FA3FF"

[pool.rare]
weight = 15
color = "#B36BFF"

[pool.epic]
weight = 10
color = "#FFC23D"

[lost_on_failure]
# What a failed sortie takes from the equipped AC, per item: equipId, "part name", or an OS Tuning row = 0 (kept) or
# 1 (lost). Unlisted: every weapon and frame part / internal is lost, the OS Tunings are kept.
# Core expansions (5010 Assault Armor, 5020 Pulse Armor, 5030 Pulse Protection, 5040 Terminal Armor): the equipped one
# loses its item and its OS Tuning level (back to 0). The other OS Tunings and our own chips (9001..): each installed
# one loses ONE level.
5010 = 1    # Assault Armor
5020 = 1    # Pulse Armor
5030 = 1    # Pulse Protection
5040 = 1    # Terminal Armor
10 = 1      # Kinetic Weapons - Fire Control Tuning
20 = 1      # Energy Weapons - Output Control Tuning
30 = 1      # Explosive Weapons - Fuse Control Tuning
40 = 1      # Melee Weapons - Drive Control Tuning
50 = 1      # Direct Hit Modifier - Damage Tuning
1010 = 1    # ACS - Dynamic Deflection Control Tuning
2020 = 1    # Repair Kits - Optimization
3010 = 1    # Access Speed - Optimization
4010 = 1    # Weight Control
5050 = 1    # Boost Kick
5060 = 1    # Manual Aiming
5070 = 1    # Weapon Bay
5080 = 1    # Quick Turn
9001 = 1    # Blindage renforcé (our own chips: chips/ folder)
9002 = 1    # Générateur surcadencé
9003 = 1    # Alliages légers
9004 = 1    # Chargeurs étendus
9005 = 1    # Contrat préférentiel
9006 = 1    # Prime de performance
9007 = 1    # Nanoréparation
9008 = 1    # Prime de série
9009 = 1    # Récupération
9010 = 1    # Dernier recours
9011 = 1    # Impact amplifié

[os_tuning]
# Effect of each OS Tuning level, by OsReinforce row: "value/value/..." (1 to 5 levels; their count is the tuning's
# max level). The game applies these values in missions and the OS Tuning texts show them. Unlisted: the game's values.
# Core expansions (5010..5040: level 1 unlocks, the next levels add charges) and on/off tunings are best left alone;
# repair kits (2020) take only the game's values 1..4 (+500 to +2 000 AP repaired per kit). A save already above a
# new max keeps the max effect.
10 = "6/12/15"     # Kinetic Weapons - Fire Control Tuning, damage +% (game: 3/6/9/12/15)
20 = "6/12/15"     # Energy Weapons - Output Control Tuning, damage +% (game: 3/6/9/12/15)
30 = "6/12/15"     # Explosive Weapons - Fuse Control Tuning, damage +% (game: 3/6/9/12/15)
40 = "10/15"       # Melee Weapons - Drive Control Tuning, damage +% (game: 5/10/15)
50 = "10/15"       # Direct Hit Modifier - Damage Tuning, direct hit damage +% (game: 5/10/15)
1010 = "6/12/15"   # ACS - Dynamic Deflection Control Tuning, damage taken -% (game: 3/6/9/12/15)
2020 = "2/4"       # Repair Kits - Optimization, +1 000 / +2 000 AP per kit (game: +500 / +1 000 / +1 500 / +2 000)
3010 = "100"       # Access Speed - Optimization, +% (game: 50/100)

[max_occurrences]
# How many times per run an item can be offered: every reward choice or shop that shows it counts, picked or not;
# after that it never comes back. Keys: equipId, "part name" or OS Tuning row (any OS Tuning), value 1 to 8
# (0 = no limit, like unlisted; above 8 reads as 8). Losing an item on a failed sortie does not change its count. Shipped: each core
# expansion as many times as it has levels, so it can be raised to its max over several picks.
5010 = 3    # Assault Armor
5020 = 2    # Pulse Armor
5030 = 3    # Pulse Protection
5040 = 1    # Terminal Armor

